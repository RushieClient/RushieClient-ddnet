[files]
extend-exclude = [
	"build-*/",
	"build/",
	"data/countryflags",
	"data/languages",
	"data/tclient/languages",
	"data/skins",
	"ddnet-libs",
	"other/icons/*.icns",
	"memcheck.supp",
	"scripts/android/files/res",
	"src/engine/external",
	"src/game/client/components/rclient/external/miniaudio.h",

	# tests with invalid words
	"src/test/windows_test.cpp",
	"src/test/str_test.cpp",
	"src/test/voice_chat_test.cpp",
]

[default]
extend-ignore-re = [
	'TClient',
	'lod',
	'LOD',
	'Lod',
	'PARM',
	'PNGs',
	'SEH',
	'UPnP',
	'Datas',
	'datas',
	'iy',
	'ba',
	'cl_nameplates_ids_seperate_line',
	'LWS_.*_WRITEABLE',
	'0x510E527FUL',
	'I\*\*nteger',
	's\*\*tring',
	'Dum',
	'ND',
	'fo',
	'nd',
]
